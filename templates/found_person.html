<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register Found Person - ResQLink</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="registration-container">

    <h1 class="brand-heading"><img src="{{ url_for('static', filename='resqlink-logo.svg') }}" alt="ResQLink logo"> <span>ResQLink</span></h1>

    <p class="subtitle">
        Register Found / Sheltered Person
    </p>


    <div class="form-section">

        <form
            action="{{ url_for('register_found_person') }}"
            method="POST"
        >

            <label for="name">
                Person Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter person's name if known"
                required
            >


            <label for="age">
                Age
            </label>

            <input
                type="number"
                id="age"
                name="age"
                placeholder="Enter age"
                min="1"
                required
            >


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="4"
                placeholder="Enter appearance or identifying details"
            ></textarea>


            <label for="current_location">
                Current Location
            </label>

            <input
                type="text"
                id="current_location"
                name="current_location"
                placeholder="Example: Government Hospital"
                required
            >


            <label for="status">
                Status
            </label>

            <select
                id="status"
                name="status"
                required
            >

                <option value="">
                    Select Status
                </option>

                <option value="Safe">
                    Safe
                </option>

                <option value="Injured">
                    Injured
                </option>

                <option value="Hospitalized">
                    Hospitalized
                </option>

            </select>


            <button
                type="submit"
                class="main-button"
            >
                Register Found Person
            </button>

        </form>

    </div>


    <a
        href="{{ url_for('registration') }}"
        class="back-button"
    >
        Back to Registration
    </a>

</div>

</body>

</html>
